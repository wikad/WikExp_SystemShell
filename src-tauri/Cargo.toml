[package]
name = "wikexp"
version = "0.1.0"
description = "WikExp: własny pulpit dla Windows w stylu terminala, zamiennik explorer.exe dla programisty (pliki, edytor, terminal, git, Docker, procesy, monitor)"
authors = ["Wiktor Adamczyk"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wikexp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
sysinfo = "0.35"
# szukanie w projekcie (Ctrl+Shift+F): przechodzenie po plikach z .gitignore + regex
ignore = "0.4"
regex = "1"

# tylko Windows: wywołania WinAPI dla paska bocznego (AppBar, lista okien, ikony)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_Power", "Win32_UI_Input_KeyboardAndMouse", "Win32_Security", "Win32_System_Registry", "Win32_System_SystemInformation"] }
png = "0.17"
base64 = "0.22"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
